
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            background: #153b2e;
            color: white;
            position: fixed;
            padding: 25px 15px;
        }

        .sidebar h2 {
            margin-bottom: 35px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background: #246247;
        }

        .main {
            margin-left: 240px;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        .card h3 {
            color: #555;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            color: #176b45;
        }

        .actions {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-top: 25px;
        }

        .actions a {
            display: inline-block;
            padding: 12px 18px;
            background: #176b45;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 8px 8px 8px 0;
        }

        .actions a:hover {
            background: #105436;
        }

        @media(max-width: 700px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main {
                margin-left: 0;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="sidebar">

    <h2>Student System</h2>

    <a href="/admin-dashboard/">Dashboard</a>
    <a href="/students/">Manage Students</a>
    <a href="/bulk-register-page/">Bulk Registration</a>
    <a href="/admin/">Django Administration</a>

</div>

<div class="main">

    <div class="header">
        <h1>Admin Dashboard</h1>
        <p>Welcome, Administrator</p>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Students</h3>
            <div class="number">{{ total_students }}</div>
        </div>

        <div class="card">
            <h3>Total Results</h3>
            <div class="number">{{ total_results }}</div>
        </div>

    </div>

    <div class="actions">

        <h2>Quick Actions</h2>

        <a href="/bulk-register-page/">Upload Students CSV</a>

        <a href="/admin/snippets/student/add/">Add Student</a>

        <a href="/admin/snippets/result/add/">Add Student Result</a>

        <a href="/admin/snippets/student/">View Students</a>

        <a href="/admin/snippets/result/">View Results</a>

    </div>

</div>

</body>
</html>
