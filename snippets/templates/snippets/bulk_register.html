
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Register Students</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        h2 {
            color: #263238;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            box-sizing: border-box;
        }

        button {
            background: #176b45;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #105436;
        }

        #results {
            margin-top: 25px;
            display: none;
        }

        .summary {
            padding: 15px;
            background: #f1f5f3;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #176b45;
            color: white;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .failed {
            color: red;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Bulk Register Students</h2>

    <p>Select a CSV file containing student details.</p>

    <form id="uploadForm"
          method="POST"
          action="/bulk-register-students/"
          enctype="multipart/form-data">

        {% csrf_token %}

        <input type="file" name="file" accept=".csv" required>

        <button type="submit" id="uploadButton">
            Upload Students
        </button>
    </form>

    <p id="message"></p>

    <div id="results">

        <h3>Registration Results</h3>

        <div class="summary" id="summary"></div>

        <table>
            <thead>
                <tr>
                    <th>CSV Row</th>
                    <th>Status</th>
                    <th>Message</th>
                </tr>
            </thead>

            <tbody id="resultsBody"></tbody>
        </table>

    </div>

</div>

<script>
    const form = document.getElementById("uploadForm");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const button = document.getElementById("uploadButton");
        const message = document.getElementById("message");
        const results = document.getElementById("results");

        const formData = new FormData(form);

        button.disabled = true;
        button.textContent = "Uploading...";
        message.textContent = "";
        results.style.display = "none";

        try {
            const response = await fetch(form.action, {
                method: "POST",
                body: formData,
                headers: {
                    "Accept": "application/json"
                },
                credentials: "same-origin"
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || JSON.stringify(data)
                );
            }

            document.getElementById("summary").textContent =
                "Created: " + data.created +
                " | Failed: " + data.failed;

            const tableBody = document.getElementById("resultsBody");
            tableBody.innerHTML = "";

            if (data.created > 0) {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>Successful registrations</td>
                    <td class="success">SUCCESS</td>
                    <td>${data.created} student(s) registered successfully.</td>
                `;

                tableBody.appendChild(row);
            }

            data.failed_rows.forEach(function(item) {
                const row = document.createElement("tr");

                const rowCell = document.createElement("td");
                rowCell.textContent = item.row;

                const statusCell = document.createElement("td");
                statusCell.textContent = "FAILED";
                statusCell.className = "failed";

                const messageCell = document.createElement("td");
                messageCell.textContent = item.error;

                row.appendChild(rowCell);
                row.appendChild(statusCell);
                row.appendChild(messageCell);

                tableBody.appendChild(row);
            });

            results.style.display = "block";

        } catch (error) {
            message.textContent = error.message;
        }

        button.disabled = false;
        button.textContent = "Upload Students";
    });
</script>

</body>
</html>
