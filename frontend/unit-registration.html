
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Registration - Kisii University</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 1000px;
            margin: 35px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .summary .card h3 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        .unit {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .unit:last-child {
            border-bottom: none;
        }

        .unit input {
            width: 18px;
            height: 18px;
        }

        .unit-info {
            flex: 1;
        }

        .unit-info p {
            color: #64748b;
            font-size: 14px;
            margin-top: 5px;
        }

        .type {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            background: #dbeafe;
            color: #1d4ed8;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        .registration-status {
            margin-top: 12px;
            color: #475569;
            font-size: 14px;
        }

        @media(max-width: 600px) {
            header {
                padding: 16px 5%;
            }

            main {
                padding: 12px;
            }

            .unit {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>🎓 Kisii University</h2>
    <a href="dashboard.html">Back to Dashboard</a>
</header>

<main>

    <div class="card">
        <h2>Unit Registration</h2>
        <p style="margin-top:8px;color:#64748b;">
            Select your units and submit them for administrator approval.
        </p>
    </div>

    <div class="summary">
        <div class="card">
            <h3 id="totalUnits">0</h3>
            <p>Available Units</p>
        </div>

        <div class="card">
            <h3 id="coreUnits">0</h3>
            <p>Core Units</p>
        </div>

        <div class="card">
            <h3 id="electiveUnits">0</h3>
            <p>Elective Units</p>
        </div>
    </div>

    <div class="card">
        <h3>Available Units</h3>
        <div id="unitsList" style="margin-top:15px;">
            Loading units...
        </div>

        <button id="submitBtn" onclick="submitUnits()" disabled>
            Submit Selected Units
        </button>

        <p id="message" class="message"></p>
    </div>

    <div class="card">
        <h3>My Registration Status</h3>
        <div id="registrationsList" class="registration-status">
            Loading registrations...
        </div>
    </div>

</main>

<script>
const API = "http://127.0.0.1:8000";
const token = localStorage.getItem("studentToken");

let availableUnits = [];

if (!token) {
    window.location.href = "index.html";
}

async function loadUnits() {
    try {
        const response = await fetch(
            `${API}/student-available-units/`,
            {
                headers: {
                    "Authorization": "Token " + token
                }
            }
        );

        if (!response.ok) {
            throw new Error("Could not load available units.");
        }

        availableUnits = await response.json();

        document.getElementById("totalUnits").textContent =
            availableUnits.length;

        document.getElementById("coreUnits").textContent =
            availableUnits.filter(unit => unit.unit_type === "CORE").length;

        document.getElementById("electiveUnits").textContent =
            availableUnits.filter(unit => unit.unit_type === "ELECTIVE").length;

        displayUnits();

    } catch (error) {
        document.getElementById("unitsList").textContent = error.message;
    }
}

function displayUnits() {
    const container = document.getElementById("unitsList");

    container.innerHTML = "";

    if (availableUnits.length === 0) {
        container.textContent = "No units are currently available for your course.";
        return;
    }

    availableUnits.forEach(unit => {
        container.innerHTML += `
            <label class="unit">
                <input type="checkbox"
                    value="${unit.id}"
                    class="unit-checkbox">

                <div class="unit-info">
                    <strong>${unit.unit_code} - ${unit.unit_name}</strong>
                    <p>
                        Year ${unit.year_of_study} |
                        ${unit.semester} |
                        ${unit.academic_year}
                    </p>
                </div>

                <span class="type">
                    ${unit.unit_type}
                </span>
            </label>
        `;
    });

    document.getElementById("submitBtn").disabled = false;
}

async function submitUnits() {
    const selected = Array.from(
        document.querySelectorAll(".unit-checkbox:checked")
    ).map(checkbox => Number(checkbox.value));

    const message = document.getElementById("message");

    if (selected.length === 0) {
        message.textContent = "Please select at least one unit.";
        return;
    }

    const response = await fetch(
        `${API}/student-register-units/`,
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Token " + token
            },
            body: JSON.stringify({
                unit_ids: selected
            })
        }
    );

    const data = await response.json();

    if (response.ok) {
        message.textContent = data.message;

        await loadRegistrations();
    } else {
        message.textContent = data.error || "Registration failed.";
    }
}

async function loadRegistrations() {
    try {
        const response = await fetch(
            `${API}/student-unit-registrations/`,
            {
                headers: {
                    "Authorization": "Token " + token
                }
            }
        );

        const registrations = await response.json();

        const container =
            document.getElementById("registrationsList");

        container.innerHTML = "";

        if (!registrations.length) {
            container.textContent = "You have not registered for any units yet.";
            return;
        }

        registrations.forEach(registration => {
            container.innerHTML += `
                <p style="padding:10px 0;border-bottom:1px solid #e2e8f0;">
                    <strong>${registration.unit.unit_code}</strong>
                    - ${registration.unit.unit_name}
                    | ${registration.status}
                    ${registration.rejection_reason
                        ? "<br>Reason: " + registration.rejection_reason
                        : ""}
                </p>
            `;
        });

    } catch (error) {
        document.getElementById("registrationsList").textContent =
            "Could not load registration status.";
    }
}

loadUnits();
loadRegistrations();
</script>

</body>
</html>
