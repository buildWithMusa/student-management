
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Slip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Kisii University Student Portal</h2>
        <p>Academic Result Slip</p>
    </header>

    <main class="result-container">

        <h2>Academic Results</h2>

        <div class="filters">
            <div>
                <label for="academicYear">Academic Year</label>
                <select id="academicYear">
                    <option value="">Select Academic Year</option>
                </select>
            </div>

            <div>
                <label for="semester">Semester</label>
                <select id="semester">
                    <option value="all">All Semesters</option>
                    <option value="Semester 1">Semester 1</option>
                    <option value="Semester 2">Semester 2</option>
                </select>
            </div>

            <button onclick="loadResults()">View Results</button>
        </div>

        <div id="studentInfo"></div>

        <table>
            <thead>
                <tr>
                    <th>Unit Name</th>
                    <th>Marks</th>
                    <th>Grade</th>
                    <th>Description</th>
                    <th>Semester</th>
                    <th>Academic Year</th>
                </tr>
            </thead>
            <tbody id="resultsBody">
                <tr>
                    <td colspan="6">Select an academic year to view results.</td>
                </tr>
            </tbody>
        </table>

    </main>
    <script src="result-slip.js"></script>

</body>
</html>
